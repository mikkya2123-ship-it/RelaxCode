<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <title>Snitch — наблюдатель RelaxCode</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <svg class="sprite" aria-hidden="true">
      <symbol id="i-overview" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></symbol>
      <symbol id="i-runs" viewBox="0 0 24 24"><path d="M4 6h10M4 12h7M4 18h12"/><path d="M17 10l4 2-4 2z"/></symbol>
      <symbol id="i-incidents" viewBox="0 0 24 24"><path d="M12 3 2.5 20h19L12 3Z"/><path d="M12 9v5"/><circle cx="12" cy="17.5" r=".6"/></symbol>
      <symbol id="i-events" viewBox="0 0 24 24"><path d="M3 12h4l2.5-6 4 12 2.5-6h5"/></symbol>
      <symbol id="i-tools" viewBox="0 0 24 24"><path d="M14.5 6.5a4.5 4.5 0 0 0 5.7 5.7L21 21l-2 1-8.5-8.5a4.5 4.5 0 0 1-5.7-5.7L7 9l2-2 5.5-.5Z"/></symbol>
      <symbol id="i-files" viewBox="0 0 24 24"><path d="M6 3h8l4 4v14H6z"/><path d="M14 3v5h4"/></symbol>
      <symbol id="i-commands" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="m7 9 3 3-3 3M13 15h4"/></symbol>
      <symbol id="i-mcp" viewBox="0 0 24 24"><path d="M9 3v5M15 3v5"/><path d="M6 8h12v4a6 6 0 0 1-12 0z"/><path d="M12 18v3"/></symbol>
      <symbol id="i-live" viewBox="0 0 24 24"><circle cx="12" cy="12" r="2.5"/><path d="M6.5 6.5a7.8 7.8 0 0 0 0 11M17.5 6.5a7.8 7.8 0 0 1 0 11"/><path d="M3.5 3.5a12 12 0 0 0 0 17M20.5 3.5a12 12 0 0 1 0 17"/></symbol>
      <symbol id="i-ai" viewBox="0 0 24 24"><path d="m12 3 1.8 4.7L18.5 9.5l-4.7 1.8L12 16l-1.8-4.7L5.5 9.5l4.7-1.8L12 3Z"/><path d="m18 15 .9 2.1 2.1.9-2.1.9L18 21l-.9-2.1-2.1-.9 2.1-.9L18 15Z"/></symbol>
      <symbol id="i-diagnostics" viewBox="0 0 24 24"><path d="M4 13h3l2-5 3 10 2.5-5H20"/><rect x="3" y="3" width="18" height="18" rx="3"/></symbol>
      <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M20 11a8 8 0 1 0-2.3 6.7"/><path d="M20 4v7h-7"/></symbol>
      <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m16.5 16.5 4 4"/></symbol>
      <symbol id="i-copy" viewBox="0 0 24 24"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V5a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h3"/></symbol>
      <symbol id="i-close" viewBox="0 0 24 24"><path d="m5 5 14 14M19 5 5 19"/></symbol>
      <symbol id="i-external" viewBox="0 0 24 24"><path d="M14 4h6v6M20 4l-9 9"/><path d="M18 13v6H5V6h6"/></symbol>
      <symbol id="i-scan" viewBox="0 0 24 24"><path d="M4 8V4h4M20 8V4h-4M4 16v4h4M20 16v4h-4"/><path d="M8 12h8"/></symbol>
      <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 3v12M7 10l5 5 5-5"/><path d="M4 20h16"/></symbol>
    </svg>

    <div class="app">
      <aside class="sidebar">
        <div class="brand">
          <div class="brand-mark"><span></span></div>
          <div class="brand-text">
            <h1>Snitch</h1>
            <p>наблюдатель RelaxCode</p>
          </div>
        </div>

        <div class="window-row">
          <label for="hours">Окно</label>
          <select id="hours" aria-label="Окно наблюдения">
            <option value="1">1 час</option>
            <option value="6">6 часов</option>
            <option value="24" selected>24 часа</option>
            <option value="72">3 дня</option>
            <option value="168">7 дней</option>
          </select>
        </div>

        <nav class="nav" id="nav" aria-label="Разделы">
          <button class="nav-item" data-view="overview" data-icon="overview"><svg><use href="#i-overview"/></svg><span>Обзор</span></button>
          <button class="nav-item" data-view="runs" data-icon="runs"><svg><use href="#i-runs"/></svg><span>Запуски</span><em class="nav-badge" id="badgeRuns"></em></button>
          <button class="nav-item" data-view="incidents" data-icon="incidents"><svg><use href="#i-incidents"/></svg><span>Инциденты</span><em class="nav-badge danger" id="badgeIncidents"></em></button>
          <button class="nav-item" data-view="events" data-icon="events"><svg><use href="#i-events"/></svg><span>События</span></button>
          <button class="nav-item" data-view="tools" data-icon="tools"><svg><use href="#i-tools"/></svg><span>Инструменты</span></button>
          <button class="nav-item" data-view="files" data-icon="files"><svg><use href="#i-files"/></svg><span>Файлы</span></button>
          <button class="nav-item" data-view="commands" data-icon="commands"><svg><use href="#i-commands"/></svg><span>Команды</span></button>
          <button class="nav-item" data-view="mcp" data-icon="mcp"><svg><use href="#i-mcp"/></svg><span>MCP</span></button>
          <button class="nav-item" data-view="live" data-icon="live"><svg><use href="#i-live"/></svg><span>Живой режим</span></button>
          <button class="nav-item" data-view="ai" data-icon="ai"><svg><use href="#i-ai"/></svg><span>Для ИИ</span></button>
          <button class="nav-item" data-view="diagnostics" data-icon="diagnostics"><svg><use href="#i-diagnostics"/></svg><span>Диагностика</span></button>
        </nav>

        <div class="sidebar-foot">
          <button class="probe-card" id="probeCard" data-view="live">
            <span class="probe-dot" id="probeDot"></span>
            <span class="probe-copy">
              <strong id="probeTitle">Проверяю зонд…</strong>
              <small id="probeText">живой режим</small>
            </span>
            <svg class="ico-sm"><use href="#i-live"/></svg>
          </button>
          <button class="btn ghost wide" data-action="scan"><svg class="ico-sm"><use href="#i-scan"/></svg>Сканировать сейчас</button>
          <div class="sidebar-meta">
            <span id="versionLabel">snitch</span>
            <span id="sseLabel" class="sse">подключение…</span>
          </div>
        </div>
      </aside>

      <div class="shell">
        <header class="topbar">
          <div class="title-block">
            <h2 id="viewTitle">Обзор</h2>
            <p id="viewSubtitle">Что происходит в IDE прямо сейчас</p>
          </div>
          <div class="search-wrap" id="searchWrap">
            <svg class="ico-sm"><use href="#i-search"/></svg>
            <input id="search" type="search" placeholder="Поиск по запросам, ошибкам, файлам…" autocomplete="off" />
            <kbd>/</kbd>
          </div>
          <div class="top-actions">
            <button class="icon-btn" data-action="refresh" title="Обновить (r)"><svg><use href="#i-refresh"/></svg></button>
            <button class="btn ghost" data-action="digest" title="Записать отчёт в out/"><svg class="ico-sm"><use href="#i-download"/></svg>Отчёт</button>
          </div>
        </header>

        <div class="health-strip" id="healthStrip"></div>

        <main id="view" class="view" aria-live="polite">
          <div class="skeleton-grid">
            <div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div>
          </div>
        </main>
      </div>
    </div>

    <div class="drawer-backdrop hidden" id="drawerBackdrop"></div>
    <aside class="drawer hidden" id="drawer" aria-label="Детали запуска">
      <div id="drawerContent"></div>
    </aside>
    <div class="toasts" id="toasts"></div>
    <div class="loading-bar" id="loadingBar"></div>

    <script type="module" src="/app.js"></script>
  </body>
</html>
