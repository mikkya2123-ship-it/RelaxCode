<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
  <title id="title">RelaxCode — AI IDE for Windows</title>
  <desc id="desc">A dark editorial banner showing RelaxCode beside an agent workspace.</desc>
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity=".035"/>
    </pattern>
    <clipPath id="shell"><rect x="730" y="74" width="484" height="492" rx="18"/></clipPath>
  </defs>
  <rect width="1280" height="640" fill="#111113"/>
  <rect width="1280" height="640" fill="url(#grid)"/>
  <path d="M0 0h18v640H0z" fill="#6ee7b7"/>

  <g transform="translate(72 72)">
    <g fill="none" stroke="#6ee7b7" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
      <path d="M20 7c-9 5-14 15-12 25 2 11 11 19 22 20 12 1 23-7 26-18 3-10-1-21-10-27"/>
      <path d="M20 7l5 11 10-8 1 13 13-2-6 12 10 7-13 4 1 13-11-7-8 10-2-13-13 2 6-12-10-7 13-4-1-13z"/>
    </g>
    <text x="74" y="42" fill="#f4f4f5" font-family="Segoe UI,Arial,sans-serif" font-size="25" font-weight="700">RelaxCode</text>
  </g>

  <text x="72" y="205" fill="#6ee7b7" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="700" letter-spacing="3">OPEN-SOURCE · WINDOWS · BYOK</text>
  <text x="68" y="286" fill="#fafafa" font-family="Segoe UI,Arial,sans-serif" font-size="72" font-weight="750" letter-spacing="-3">Build with an agent</text>
  <text x="72" y="356" fill="#a1a1aa" font-family="Segoe UI,Arial,sans-serif" font-size="27">that can use your whole workspace.</text>

  <g font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="600">
    <rect x="72" y="414" width="112" height="38" fill="#1f2024" stroke="#3f3f46"/>
    <text x="96" y="439" fill="#e4e4e7">EDITOR</text>
    <rect x="196" y="414" width="108" height="38" fill="#1f2024" stroke="#3f3f46"/>
    <text x="221" y="439" fill="#e4e4e7">AGENT</text>
    <rect x="316" y="414" width="128" height="38" fill="#1f2024" stroke="#3f3f46"/>
    <text x="337" y="439" fill="#e4e4e7">TERMINAL</text>
    <rect x="456" y="414" width="82" height="38" fill="#17332b" stroke="#3d806b"/>
    <text x="480" y="439" fill="#9ff1d2">MCP</text>
  </g>

  <text x="72" y="524" fill="#71717a" font-family="Segoe UI,Arial,sans-serif" font-size="16">Bring your own model. Keep control of every action.</text>

  <g clip-path="url(#shell)">
    <rect x="730" y="74" width="484" height="492" fill="#18181b" stroke="#3f3f46" stroke-width="2"/>
    <rect x="730" y="74" width="484" height="52" fill="#202024"/>
    <circle cx="758" cy="100" r="5" fill="#6ee7b7"/>
    <circle cx="778" cy="100" r="5" fill="#52525b"/>
    <circle cx="798" cy="100" r="5" fill="#52525b"/>
    <text x="832" y="106" fill="#a1a1aa" font-family="Segoe UI,Arial,sans-serif" font-size="13">PROJECT / RELAXCODE</text>
    <rect x="730" y="126" width="150" height="440" fill="#151518"/>
    <path d="M880 126v440" stroke="#2d2d32"/>
    <g font-family="Consolas,monospace" font-size="13">
      <text x="752" y="166" fill="#71717a">EXPLORER</text>
      <text x="752" y="203" fill="#e4e4e7">▾ src</text>
      <text x="770" y="232" fill="#a1a1aa">  main</text>
      <text x="770" y="261" fill="#a1a1aa">  renderer</text>
      <text x="770" y="290" fill="#a1a1aa">  shared</text>
      <text x="752" y="327" fill="#a1a1aa">  package.json</text>
      <text x="752" y="356" fill="#a1a1aa">  README.md</text>

      <text x="910" y="170" fill="#71717a">AGENT</text>
      <text x="910" y="211" fill="#f4f4f5">Refine the onboarding</text>
      <text x="910" y="237" fill="#f4f4f5">and verify the build.</text>
      <rect x="910" y="270" width="250" height="74" fill="#202024" stroke="#3f3f46"/>
      <circle cx="932" cy="294" r="5" fill="#6ee7b7"/>
      <text x="949" y="299" fill="#d4d4d8">Read project files</text>
      <circle cx="932" cy="322" r="5" fill="#6ee7b7"/>
      <text x="949" y="327" fill="#d4d4d8">Update interface</text>
      <rect x="910" y="365" width="250" height="118" fill="#141416" stroke="#2d2d32"/>
      <text x="930" y="394" fill="#71717a">TERMINAL</text>
      <text x="930" y="426" fill="#6ee7b7">› npm run typecheck</text>
      <text x="930" y="454" fill="#a1a1aa">  completed successfully</text>
    </g>
    <rect x="910" y="514" width="250" height="1" fill="#3f3f46"/>
    <text x="910" y="542" fill="#71717a" font-family="Segoe UI,Arial,sans-serif" font-size="12">Chat · Agent · Plan</text>
  </g>
  <rect x="730" y="74" width="484" height="492" rx="18" fill="none" stroke="#52525b" stroke-width="2"/>
</svg>
